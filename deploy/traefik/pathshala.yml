# A route for the studio in Coolify's Traefik (v3): copy to /data/coolify/proxy/dynamic/pathshala.yaml and replace
# studio.example.org with the studio's domain (its DNS A record must point at this server). Traefik gets the TLS
# certificate from Let's Encrypt and forwards to the studio on the Docker gateway address (HOST in studio.env).
http:
  routers:
    pathshala-studio:
      rule: Host(`studio.example.org`)
      entryPoints:
        - https
      service: pathshala-studio
      tls:
        certResolver: letsencrypt
  services:
    pathshala-studio:
      loadBalancer:
        servers:
          - url: 'http://10.0.1.1:4800'
        passHostHeader: true
