<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pathshala model viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: radial-gradient(120% 90% at 50% 30%, #1d2533 0%, #0b0f16 70%); overflow: hidden; }
    body.light { background: radial-gradient(120% 90% at 50% 30%, #ffffff 0%, #e6eaf0 75%); }
    body.transparent { background: transparent; }
    #stage { position: fixed; inset: 0; }
    #msg { position: fixed; inset: 0; display: grid; place-items: center; color: #9aa7b8; font: 14px/1.4 system-ui, sans-serif; pointer-events: none; text-align: center; padding: 24px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.min.js", "three/addons/": "../vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="msg">Loading model…</div>
  <script type="module">
    // Generic viewer for "model" assets (static GLB): orbit, zoom, auto-fit. ?src=<url>&bg=dark|light|transparent
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { createStage } from '../lib/stage.js';
    import { createBridge } from '../lib/bridge.js';

    const params = new URLSearchParams(location.search);
    const src = params.get('src');
    document.body.classList.add(params.get('bg') || 'dark');
    const msg = document.getElementById('msg');
    const stage = createStage(document.getElementById('stage'), { fov: 35 });
    const bridge = createBridge({ asset: params.get('asset') || 'model-viewer', commands: {
      capture: ({ width, height }) => stage.capture({ width, height }),
    } });

    if (!src) {
      msg.textContent = 'No model: pass ?src=path/to/model.glb';
    } else {
      new GLTFLoader().load(src, (gltf) => {
        const root = gltf.scene;
        stage.scene.add(root);
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const radius = size.length() / 2 || 1;
        const dist = radius / Math.sin(THREE.MathUtils.degToRad(stage.camera.fov / 2)) * 1.05;
        stage.camera.near = dist / 100;
        stage.camera.far = dist * 100;
        stage.camera.position.copy(center).add(new THREE.Vector3(0.6, 0.45, 1).normalize().multiplyScalar(dist));
        stage.camera.updateProjectionMatrix();
        stage.controls.target.copy(center);
        stage.controls.update();
        if (gltf.animations.length) {
          const mixer = new THREE.AnimationMixer(root);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
          stage.addTicker((dt) => (mixer.update(dt), true));
        }
        msg.remove();
        stage.invalidate();
        bridge.emit('ready', { asset: 'model-viewer', src });
      }, undefined, (err) => {
        msg.textContent = `Could not load ${src}: ${err.message || err}`;
      });
    }
  </script>
</body>
</html>
