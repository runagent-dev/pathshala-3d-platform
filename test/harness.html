<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Figure harness</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- Used by the figure tests, the exporter and the visual comparison: loads one figure (?src=…) in an iframe,
       like the book does, and talks to it through shared/lib/host.js. -->
  <iframe id="figure" allow="fullscreen"></iframe>
  <script type="module">
    import { connectAsset } from '../shared/lib/host.js';

    const iframe = document.getElementById('figure');
    const conn = connectAsset(iframe, { timeout: 24 * 3600 * 1000 }); // the driver keeps its own time limits
    const calls = new Map();
    let seq = 0;
    const toBase64 = (buf) => {
      let s = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
      return btoa(s);
    };
    window.harness = {
      /** Starts a command; poll state(ticket) for the answer (binary answers come back as { base64 }). */
      start(type, payload) {
        const ticket = ++seq;
        const entry = { done: false };
        calls.set(ticket, entry);
        conn.call(type, payload).then(
          (value) => Object.assign(entry, { done: true, value: value instanceof ArrayBuffer ? { base64: toBase64(value), bytes: value.byteLength } : value }),
          (err) => Object.assign(entry, { done: true, error: String(err?.message || err) }),
        );
        return ticket;
      },
      state(ticket) {
        const entry = calls.get(ticket);
        if (entry?.done) calls.delete(ticket);
        return entry || { done: true, error: 'unknown call' };
      },
    };
    iframe.src = new URLSearchParams(location.search).get('src');
  </script>
</body>
</html>
