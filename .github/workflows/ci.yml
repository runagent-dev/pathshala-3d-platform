# Checks every push to main and every pull request. Each step only calls npm scripts, so the same runs
# locally (and moves to another CI service easily).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Check, lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run types
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high

  figures:
    name: Figures in the browser
    needs: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - id: changed
        run: node scripts/ci-figures.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }} >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.figures != '' || steps.changed.outputs.templates == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changed.outputs.figures != ''
        run: npm run test:figures
        env: { FIGURES: '${{ steps.changed.outputs.figures }}' }
      - if: steps.changed.outputs.templates == 'true'
        run: npm run test:templates
      - if: steps.changed.outputs.templates == 'true'
        run: npx playwright test test/browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }

  visual:
    name: Visual comparison with the base branch
    if: github.event_name == 'pull_request'
    needs: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual -- --base origin/${{ github.base_ref }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: visual-comparison, path: test-results/visual, retention-days: 14 }

  package:
    name: Handoff zips
    needs: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run package:all
      - uses: actions/upload-artifact@v4
        with: { name: zips, path: 'dist/*.zip', retention-days: 30 }
