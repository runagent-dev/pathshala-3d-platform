# Checks every push to main and every pull request. Each step only calls npm scripts, so the same runs
# locally (and moves to another CI service easily).
#
# CI runs only the fast checks (about a minute). The browser tests, the visual comparison and the handoff zips run
# on the contributor's machine before pushing (CLAUDE.md, "Browser tests run locally"): in CI they took ~90% of
# the account's Actions minutes and used it up in two days (2026-10-24/25). The zips can still be built here by
# hand: Actions → CI → Run workflow.
name: CI

on:
  push:
    branches: [main]
    # the studio pushes reviews, status and notes on its own: nothing to check when only those change
    paths-ignore: ['assets/*/reviews/**', 'assets/*/status.json', 'assets/*/NOTES.md', 'docs/**']
  pull_request:
    paths-ignore: ['assets/*/reviews/**', 'assets/*/status.json', 'assets/*/NOTES.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Check, lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run types
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high

  package:
    name: Handoff zips
    if: github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run package:all
      - uses: actions/upload-artifact@v4
        with: { name: zips, path: 'dist/*.zip', retention-days: 30 }
